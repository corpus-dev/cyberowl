<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">
    <% if (ctx.mode.electron) { %>
    <% if (ctx.dev) { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:9300 ws://localhost:9300; object-src 'none'; base-uri 'self';"
    >
    <% } else { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self';"
    >
    <% } %>
    <% } %>

    <link rel="icon" type="image/png" sizes="128x128" href="owlicons/icon-128x128.png">
    <link rel="icon" type="image/png" sizes="192x192" href="owlicons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="256x256" href="owlicons/icon-256x256.png">
    <link rel="icon" type="image/png" sizes="512x512" href="owlicons/icon-512x512.png">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
